<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaibhav Laxmi Provision Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7f5;
    color:#222;
}

header{
    background:#198754;
    color:white;
    padding:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.cart-btn{
    background:white;
    color:#198754;
    border:0;
    padding:10px 15px;
    border-radius:20px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    background:linear-gradient(135deg,#198754,#65c18c);
    color:white;
    padding:45px 20px;
    text-align:center;
}

.hero h1{
    font-size:32px;
    margin-bottom:10px;
}

.hero p{
    margin-bottom:20px;
}

.hero button{
    padding:12px 25px;
    border:0;
    border-radius:25px;
    background:white;
    color:#198754;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:20px;
    font-size:16px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:25px;
}

.categories button{
    white-space:nowrap;
    border:0;
    background:white;
    padding:10px 15px;
    border-radius:20px;
    box-shadow:0 2px 8px #ddd;
    cursor:pointer;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.product{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 10px #ddd;
}

.product-image{
    height:130px;
    background:#eef7ef;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    margin-bottom:12px;
}

.product h3{
    font-size:17px;
    margin-bottom:7px;
}

.pack{
    color:#777;
    font-size:14px;
}

.price{
    color:#198754;
    font-size:20px;
    font-weight:bold;
    margin:8px 0;
}

.add{
    width:100%;
    padding:10px;
    background:#198754;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:30px;
}

/* Cart */
.cart{
    position:fixed;
    right:-100%;
    top:0;
    width:100%;
    max-width:400px;
    height:100%;
    background:white;
    z-index:200;
    transition:.3s;
    box-shadow:-3px 0 15px #999;
    padding:20px;
    overflow:auto;
}

.cart.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:8px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    padding:12px 0;
    gap:10px;
}

.qty button{
    border:0;
    padding:5px 9px;
    margin:2px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin:20px 0;
}

.checkout{
    width:100%;
    padding:14px;
    background:#ff9800;
    border:0;
    color:white;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
}

/* Modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:300;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:450px;
    padding:25px;
    border-radius:15px;
    max-height:90vh;
    overflow:auto;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.place{
    width:100%;
    padding:13px;
    border:0;
    background:#198754;
    color:white;
    border-radius:8px;
    font-weight:bold;
}

@media(max-width:500px){
    .hero h1{
        font-size:25px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .product{
        padding:10px;
    }

    .product-image{
        height:100px;
        font-size:40px;
    }
}
</style>
</head>

<body>

<header>
<div class="header">
    <div class="logo">🛒 Vaibhav Laxmi</div>
    <button class="cart-btn" onclick="openCart()">
        🛍️ Cart (<span id="cartCount">0</span>)
    </button>
</div>
</header>

<section class="hero">
    <h1>Vaibhav Laxmi Provision Store</h1>
    <p>Daily Grocery • Best Prices • Easy Ordering</p>
    <button onclick="document.getElementById('products').scrollIntoView()">
        Shop Now
    </button>
</section>

<div class="container">

<input
    class="search"
    id="search"
    placeholder="🔍 Search grocery products..."
    oninput="showProducts()"
>

<div class="categories">
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Rice')">Rice</button>
    <button onclick="filterCategory('Dal')">Dal</button>
    <button onclick="filterCategory('Flour')">Flour</button>
    <button onclick="filterCategory('Oil')">Oil</button>
    <button onclick="filterCategory('Snacks')">Snacks</button>
    <button onclick="filterCategory('Dairy')">Dairy</button>
    <button onclick="filterCategory('Beverages')">Beverages</button>
</div>

<div id="products" class="products"></div>

</div>

<footer>
    <h3>Vaibhav Laxmi Provision Store</h3>
    <p>Thank you for shopping with us ❤️</p>
</footer>

<!-- CART -->
<div class="cart" id="cart">

<div class="cart-header">
    <h2>🛒 Your Cart</h2>
    <button class="close" onclick="closeCart()">✕</button>
</div>

<div id="cartItems"></div>

<div class="total">
    Total: ₹<span id="total">0</span>
</div>

<button class="checkout" onclick="checkout()">
    Proceed to Checkout
</button>

</div>

<!-- CHECKOUT MODAL -->
<div class="modal" id="modal">

<div class="modal-box">

<h2>📦 Checkout</h2>

<input id="name" placeholder="Customer Name">
<input id="phone" placeholder="Mobile Number">
<textarea id="address" rows="3" placeholder="Delivery Address"></textarea>

<select id="payment">
    <option value="Cash on Delivery">Cash on Delivery</option>
    <option value="Online Payment">Online Payment</option>
</select>

<button class="place" onclick="placeOrder()">
    Place Order
</button>

<br><br>

<button onclick="closeModal()" style="width:100%;padding:10px;border:0;">
    Cancel
</button>

</div>
</div>

let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let selectedCategory = "All";

function saveCart(){
    localStorage.setItem("cart",JSON.stringify(cart));
}

function filterCategory(category){
    selectedCategory=category;
    showProducts();
}

function showProducts(){

    const search =
        document.getElementById("search").value.toLowerCase();

    const container =
        document.getElementById("products");

    container.innerHTML="";

    products
    .filter(p =>
        (selectedCategory==="All" ||
         p.category===selectedCategory) &&
        p.name.toLowerCase().includes(search)
    )
    .forEach(p => {

        container.innerHTML += `

        <div class="product">

            <div class="product-image">
                ${p.emoji}
            </div>

            <h3>${p.name}</h3>

            <div class="pack">${p.pack}</div>

            <div class="price">₹${p.price}</div>

            <button class="add" onclick="addToCart(${p.id})">
                Add to Cart
            </button>

        </div>

        `;
    });
}

function addToCart(id){

    const product =
        products.find(p=>p.id===id);

    const existing =
        cart.find(i=>i.id===id);

    if(existing){
        existing.qty++;
    }else{
        cart.push({
            ...product,
            qty:1
        });
    }

    saveCart();
    updateCart();

    alert(product.name+" added to cart");
}

function updateCart(){

    document.getElementById("cartCount").innerText =
        cart.reduce((sum,item)=>sum+item.qty,0);

    const container =
        document.getElementById("cartItems");

    container.innerHTML="";

    let total=0;

    cart.forEach(item=>{

        total += item.price * item.qty;

        container.innerHTML += `

        <div class="cart-item">

            <div>
                <b>${item.name}</b><br>
                ${item.pack}<br>
                ₹${item.price}
            </div>

            <div class="qty">

                <button onclick="changeQty(${item.id},-1)">
                    −
                </button>

                ${item.qty}

                <button onclick="changeQty(${item.id},1)">
                    +
                </button>

            </div>

        </div>

        `;
    });

    document.getElementById("total").innerText=total;
}

function changeQty(id,change){

    const item =
        cart.find(i=>i.id===id);

    if(!item) return;

    item.qty += change;

    if(item.qty<=0){
        cart=cart.filter(i=>i.id!==id);
    }

    saveCart();
    updateCart();
}

function openCart(){
    document.getElementById("cart").classList.add("open");
}

function closeCart(){
    document.getElementById("cart").classList.remove("open");
}

function checkout(){

    if(cart.length===0){
        alert("Your cart is empty!");
        return;
    }

    document.getElementById("modal").classList.add("show");
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}

    if(!name || !phone || !address){

        alert("Please fill all details.");

    }

        message +=
        `• ${item.name} (${item.pack}) x ${item.qty} = ₹${item.price*item.qty}\n`;
    });

    message +=
`

Payment: ${payment}

Please confirm my order.`;

    */

    const whatsappNumber="917276711309";

    window.open(whatsappURL,"_blank");

    );
